<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sino Sila? PH Officials</title>
<style>
  :root{--bg:#fafaf7;--card:#fff;--ink:#14213d;--mute:#6b7280;--line:#e5e7eb;--blue:#0038a8;--red:#ce1126;--gold:#fcd116;--r:8px;--hero:#0b2a6f;--on-accent:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1321;--card:#161e33;--ink:#f1f5f9;--mute:#94a3b8;--line:#263050;--blue:#7aa7ff;--red:#ff7a88;--hero:#0b2a6f;--on-accent:#0d1321}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
  header{padding:2.5rem 1rem 2rem;text-align:center;background:var(--hero);color:#fff;border-bottom:4px solid var(--red)}
  header h1{margin:0;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.02em}
  header p{margin:.4rem auto 1.2rem;max-width:34rem;opacity:.9}
  .wrap{max-width:70rem;margin:0 auto;padding:1rem}
  #q{width:100%;max-width:28rem;padding:.75rem 1rem;border:0;border-radius:var(--r);font:inherit;color:#14213d;background:#fff}
  .chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.25rem .75rem;border-radius:var(--r);font:inherit;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--blue);color:var(--on-accent);border-color:var(--blue);font-weight:600}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .skip{position:absolute;left:-99rem;background:#fff;color:#000;padding:.5rem 1rem;z-index:9} .skip:focus{left:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.5rem 1rem;list-style:none;padding:0}
  .card{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.75rem}
  .card:hover,.bill:hover{border-color:var(--blue)}
  .av{flex:none;width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;font-weight:700;color:#fff}
  .card b{display:block;line-height:1.25}
  .n{margin-left:.5rem;color:var(--mute);font-size:.85rem}
  .role{display:inline-block;margin-top:.25rem;font-size:.75rem;padding:.25rem .5rem;border-radius:4px;background:var(--gold);color:#4a3b00}
  .role.sen{background:var(--line);color:var(--ink)}
  a{color:var(--blue)}
  .back{display:inline-block;margin-bottom:1rem;color:var(--blue);text-decoration:none;font-weight:600}
  .hero{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
  .hero .av{width:5rem;height:5rem;font-size:1.75rem} .hero h2{margin:0;font-size:1.8rem}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem;margin:1.5rem 0}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
  .tile strong{display:block;font-size:2rem;line-height:1} .tile span{color:var(--mute);font-size:.85rem}
  .tl{list-style:none;padding:0 0 0 1.2rem;border-left:3px solid var(--line)}
  .tl li{position:relative;margin:0 0 1rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}
  .tl li::before{content:"";position:absolute;left:-1.7rem;top:1.1rem;width:.9rem;height:.9rem;border-radius:50%;background:var(--red)}
  .badge{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--red)} .tl small{color:var(--mute)}
  .tl a{color:var(--blue)} .tile strong{font-size:clamp(1.3rem,5vw,2rem);white-space:nowrap}
  .soon{border:2px dashed var(--line);border-radius:var(--r);padding:1rem;color:var(--mute);text-align:center}
  .chart{display:flex;align-items:flex-end;gap:3px;height:6rem;margin:.5rem 0 .2rem}
  .chart i{flex:1;background:var(--blue);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .axis{display:flex;justify-content:space-between;color:var(--mute);font-size:.75rem}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin:1rem 0}
  .panel h3{margin:0 0 .5rem;font-size:1rem}
  .stack{display:flex;height:1rem;border-radius:4px;overflow:hidden;margin:.6rem 0}
  .legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.85rem;color:var(--mute)}
  .legend b{color:var(--ink)} .dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.3rem}
  .bill{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.75rem 1rem;margin:.5rem 0}
  .bill small{color:var(--mute)} .pill{font-size:.75rem;padding:.25rem .5rem;border-radius:4px;background:var(--line);color:var(--ink);white-space:nowrap}
  .sec{margin:2rem 0 .6rem;font-size:1.3rem} .tiles.big strong{font-size:clamp(1.6rem,6vw,2.6rem)}
  .strip{display:flex;gap:.8rem;overflow-x:auto;padding:.2rem 0 .8rem;scroll-snap-type:x proximity}
  .chipcard{flex:0 0 14rem;margin:0;scroll-snap-align:start} .chipcard b{display:block;line-height:1.3;margin-bottom:.3rem}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
  .barrow{display:grid;grid-template-columns:7.5rem 1fr 2.5rem;gap:.5rem;align-items:center;text-decoration:none;color:inherit;margin:.4rem 0;font-size:.9rem}
  .bar{background:var(--line);border-radius:4px;height:.75rem;overflow:hidden} .bar i{display:block;height:100%;background:var(--red)}
  .barrow b{text-align:right} .note{color:var(--mute);font-size:.8rem;margin:.6rem 0 0} .sp{flex:1}
    .skel{height:5rem;border-radius:var(--r);background:var(--line);margin:.5rem 0}
  @media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}}
  .err{border:1px solid var(--red);border-radius:var(--r);padding:1rem;margin:1rem 0}
  footer{color:var(--mute);font-size:.8rem;text-align:center;padding:2rem 1rem}
</style>
<a class="skip" href="#app">Skip to content</a>
<header>
  <h1>Sino Sila?</h1>
  <p>Who are your officials, and what have they done? Public records, in plain view. Every item links to its source.</p>
  <input id="q" type="search" placeholder="Search a name…" aria-label="Search officials">
</header>
<main class="wrap" id="app" tabindex="-1" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<noscript><p class="wrap">This site needs JavaScript to show the records.</p></noscript>
<footer>Public records only, each linked to its source. Not an accusation of wrongdoing. Unofficial, not affiliated with any government body.</footer>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = n => n.replace(/"[^"]*"/g, '').replace(/\s+/g, ' ').trim();           // drop nicknames for initials
const initials = n => { const p = clean(n).split(' ').filter(w => /^[A-Za-z]/.test(w) && !/^(Jr\.?|Sr\.?|II|III|IV)$/.test(w)); return (p[0][0] + (p[p.length-1][0] || '')).toUpperCase(); };
const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const av = n => `<div class="av" style="background:hsl(${hue(n)} 60% 28%)" aria-hidden="true">${initials(n)}</div>`;
const ICON = {membership:'🏛️', bill:'📜', vote:'🗳️', saln:'💼', campaign_finance:'💸', audit:'🔎', case:'⚖️', appointment:'📌'};
const app = document.getElementById('app'), q = document.getElementById('q');
let data = [], bills = {}, leadersOnly = false;

let sortBy = 'az';
const firstName = n => clean(n).split(' ')[0];
const last = o => clean(o.name).split(' ').filter(w => !/^(Jr\.?|II|III|IV)$/.test(w)).pop();
const nameOf = id => clean((data.find(o => o.id === id) || {}).name || '');

function overview() {
  const ids = Object.keys(bills).filter(k => k !== '_meta');
  const total = ids.reduce((n, k) => n + bills[k].total, 0);
  const byMonth = MONTHS.map(m => ids.reduce((n, k) => n + (bills[k].byMonth[m] || 0), 0));
  const max = Math.max(...byMonth);
  const recent = ids.flatMap(k => bills[k].latest.map(b => ({id: k, no: b[0], t: b[1], d: b[2], bid: b[4]})))
    .sort((x, y) => y.d.localeCompare(x.d)).slice(0, 8);
  const top = [...ids].sort((x, y) => bills[y].total - bills[x].total).slice(0, 5);
  return `<h2 class="sr">Snapshot</h2><section class="tiles big">
      <div class="tile"><strong>${data.length}</strong><span>senators, 20th Congress</span></div>
      <div class="tile"><strong>${total.toLocaleString()}</strong><span>bills filed since July 2025</span></div>
      <div class="tile"><strong>${new Date(recent[0].d + 'T00:00:00').toLocaleDateString('en', {month: 'short', day: 'numeric'})}</strong><span>most recent filing, ${recent[0].d.slice(0, 4)}</span></div></section>
    <h2 class="sec">Just filed</h2>
    <div class="strip">${recent.map(r => `<a class="bill chipcard" href="https://senate.gov.ph/legislative-documents/bills/${esc(r.bid)}" target="_blank" rel="noopener">
      <b>${esc(title(r.t))}</b><small>${esc(nameOf(r.id))} · ${esc(r.d)}</small></a>`).join('')}</div>
    <div class="two">
      <div class="panel"><h3>Senate bills filed per month</h3>
        <div class="chart" role="img" aria-label="Bills filed per month across the Senate, from ${monthName(MONTHS[0])} to ${monthName(MONTHS[MONTHS.length - 1])}. Peak ${Math.max(...byMonth)} in ${monthName(MONTHS[byMonth.indexOf(Math.max(...byMonth))])}.">${byMonth.map((n, i) => `<i title="${monthName(MONTHS[i])}: ${n}" style="height:${n / max * 100}%"></i>`).join('')}</div>
        <div class="axis"><span>${monthName(MONTHS[0])}</span><span>${monthName(MONTHS[MONTHS.length - 1])}</span></div>
        <p class="note">Most bills are filed when a Congress opens (Jul–Aug 2025).</p></div>
      <div class="panel"><h3>Most bills filed</h3>
        ${top.map(k => `<a class="barrow" href="#${esc(k)}"><span>${esc(firstName(nameOf(k)))} ${esc(last(data.find(o => o.id === k)))}</span><span class="bar"><i style="width:${bills[k].total / bills[top[0]].total * 100}%"></i></span><b>${bills[k].total}</b></a>`).join('')}
        <p class="note">Volume, not quality or importance.</p></div></div>
    <h2 class="sec">All senators</h2>`;
}

function list() {
  const t = q.value.toLowerCase();
  const rows = data.filter(o => o.name.toLowerCase().includes(t) && (!leadersOnly || o.position !== 'Senator'))
    .sort((x, y) => sortBy === 'bills' ? (bills[y.id]?.total || 0) - (bills[x.id]?.total || 0) : last(x).localeCompare(last(y)));
  const chip = (on, f, label) => `<button class="chip" aria-pressed="${on}" data-f="${f}">${label}</button>`;
  app.innerHTML = (t ? '' : overview()) + `<div class="chips">
      ${chip(!leadersOnly, 'all', 'All ' + data.length)}${chip(leadersOnly, 'lead', 'Leadership')}
      <span class="sp"></span>${chip(sortBy === 'az', 'az', 'A–Z')}${chip(sortBy === 'bills', 'bills', 'Most bills')}</div>
    <ul class="grid">${rows.map(o => `<li><a class="card" href="#${esc(o.id)}">${av(o.name)}
      <div><b>${esc(clean(o.name))}</b><br><span class="role ${o.position === 'Senator' ? 'sen' : ''}">${esc(o.position)}</span><small class="n">${bills[o.id] ? bills[o.id].total + ' bills' : ''}</small></div></a></li>`).join('')}</ul>
    ${rows.length ? '' : '<p class="soon">No senator matches that name.</p>'}`;
}


const BUCKETS = [
  ['Signed into law', '#16a34a', s => s === 'APPROVED BY THE PRESIDENT OF THE PHILIPPINES'],
  ['Moving along', '#2563eb', s => /SECOND READING|CONFERE|PASSED BY BOTH|ENROLLED|PENDING IN THE HOUSE/.test(s)],
  ['In committee', '#9ca3af', s => s === 'PENDING IN THE COMMITTEE'],
  ['Merged into another bill', '#d97706', s => s.startsWith('CONSOLIDATED')],
  ['Withdrawn', '#dc2626', s => s === 'WITHDRAWN']];
const bucketOf = st => (BUCKETS.find(b => b[2](st)) || ['Other', '#6b7280'])[0];
const MONTHS = (() => { const m = []; for (let y = 2025, mo = 7; y < 2026 || mo <= 9; mo++) { if (mo > 12) { mo = 1; y++; } m.push(`${y}-${String(mo).padStart(2, '0')}`); } return m; })();
const monthName = k => new Date(k + '-01T00:00:00').toLocaleString('en', {month: 'short', year: '2-digit'});
const ACRONYMS = new Set('PNP BJMP BFP GSIS SK VAT SUC PWD HIV AIDS ID PRC MSME ZIP CHR CHED RTC EDCOM II III IV R.A. SBN'.split(' '));
const SMALL = new Set('OF THE AND FOR IN ON TO A AN OR'.split(' '));
const title = t => t.split(/\s+/).map((w, i) => {
  const core = w.replace(/^\(+|[),.]+$/g, '');
  if (/^\(.+\)$/.test(w) && core.length <= 7 || ACRONYMS.has(w.replace(/[),]+$/, '')) || /^\d/.test(w)) return w;   // (E-VAWC), PNP, 30-DAY
  return i && SMALL.has(w) ? w.toLowerCase() : w.toLowerCase().replace(/(^|[(\-/])([a-z])/g, (m, a, b) => a + b.toUpperCase());
}).join(' ');

function billsHtml(id) {
  const b = bills[id]; if (!b) return '';
  const counts = {}; for (const [st, n] of Object.entries(b.byStatus)) counts[bucketOf(st)] = (counts[bucketOf(st)] || 0) + n;
  const max = Math.max(...MONTHS.map(m => b.byMonth[m] || 0), 1);
  return `<div class="panel"><h3>Bills filed per month</h3>
      <div class="chart" role="img" aria-label="Bills filed per month, ${MONTHS.length} months">${MONTHS.map(m => `<i title="${monthName(m)}: ${b.byMonth[m] || 0}" style="height:${(b.byMonth[m] || 0) / max * 100}%"></i>`).join('')}</div>
      <div class="axis"><span>${monthName(MONTHS[0])}</span><span>${monthName(MONTHS[MONTHS.length - 1])}</span></div></div>
    <div class="panel"><h3>Where the bills stand</h3>
      <div class="stack" role="img" aria-label="Bill status: ${BUCKETS.filter(x => counts[x[0]]).map(x => counts[x[0]] + ' ' + x[0]).join(', ')}">${BUCKETS.map(x => counts[x[0]] ? `<span title="${x[0]}: ${counts[x[0]]}" style="flex:${counts[x[0]]};background:${x[1]}"></span>` : '').join('')}</div>
      <div class="legend">${BUCKETS.filter(x => counts[x[0]]).map(x => `<span><span class="dot" style="background:${x[1]}"></span><b>${counts[x[0]]}</b> ${x[0]}</span>`).join('')}</div></div>
    <h3>Latest bills</h3>${b.latest.map(([no, t, d, st, bid]) => `<a class="bill" href="https://senate.gov.ph/legislative-documents/bills/${esc(bid)}" target="_blank" rel="noopener">
      <b>${esc(title(t))}</b><br><small>${esc(no)} · filed ${esc(d)}</small> <span class="pill">${esc(bucketOf(st))}</span></a>`).join('')}
    <p><small>Bills where this senator is listed as author, 20th Congress. Source: <a href="${esc(bills._meta.source)}" target="_blank" rel="noopener">Senate Legislative Information System</a>, retrieved ${esc(bills._meta.retrieved)}.</small></p>`;
}

function profile(o) {
  const last = o.records.map(r => r.retrieved).sort().pop();
  app.innerHTML = `<a class="back" href="#">← Everyone</a>
    <div class="hero">${av(o.name)}<div><h2>${esc(o.name)}</h2><span class="role">${esc(o.position)}</span> <small>${esc(o.chamber)} · ${esc(o.term)}</small></div></div>
    <div class="tiles">
      <div class="tile"><strong>${bills[o.id]?.total ?? '–'}</strong><span>bills authored</span></div>
      <div class="tile"><strong>${bills[o.id] ? bills[o.id].byStatus['APPROVED BY THE PRESIDENT OF THE PHILIPPINES'] || 0 : '–'}</strong><span>signed into law</span></div>
      <div class="tile"><strong>${esc(last)}</strong><span>last checked</span></div></div>
    ${billsHtml(o.id)}
    <h3>Record</h3><ul class="tl">${o.records.map(r => `<li><span class="badge"><span aria-hidden="true">${ICON[r.type] || '•'}</span> ${esc(r.type)}</span>
      <div>${esc(r.title)}</div><small>${esc(r.date)} · <a href="${esc(r.source_url)}" rel="noopener" target="_blank">view source ↗</a></small></li>`).join('')}</ul>
    <div class="soon">🗳️ Votes, SALN and more are coming soon.</div>`;
}

function route() {
  const o = data.find(o => o.id === location.hash.slice(1));
  o ? profile(o) : list();
  document.title = o ? clean(o.name) + ' – Sino Sila?' : 'Sino Sila? PH Officials';
  app.removeAttribute('aria-busy'); scrollTo(0, 0);
  if (o) app.querySelector('h2')?.setAttribute('tabindex', '-1'), app.querySelector('h2')?.focus();
}
app.onclick = e => { const f = e.target.dataset.f; if (!f) return; if (f === 'retry') return load(); if (f === 'az' || f === 'bills') sortBy = f; else leadersOnly = f === 'lead'; list(); };
q.oninput = () => { if (location.hash) location.hash = ''; else list(); };
onhashchange = route;
function load() {
  Promise.all(['data/officials.json', 'data/bills.json'].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); })))
    .then(([d, b]) => { data = d; bills = b; route(); })
    .catch(() => { app.removeAttribute('aria-busy'); app.innerHTML = '<div class="err" role="alert"><b>Couldn’t load the records.</b><p>Check your connection and try again.</p><button class="chip" data-f="retry">Retry</button></div>'; });
}
load();
</script>
