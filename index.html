<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sino Sila? PH Officials</title>
<style>
  :root{--bg:#fafaf7;--card:#fff;--ink:#14213d;--mute:#6b7280;--line:#e5e7eb;--blue:#0038a8;--red:#ce1126;--gold:#fcd116;--r:16px}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1321;--card:#161e33;--ink:#f1f5f9;--mute:#94a3b8;--line:#263050;--blue:#6ea0ff;--red:#ff6b7a}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
  header{padding:2.5rem 1rem 1.5rem;text-align:center;background:linear-gradient(135deg,var(--blue),#1a1f71 60%,var(--red));color:#fff}
  header h1{margin:0;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.02em}
  header p{margin:.4rem auto 1.2rem;max-width:34rem;opacity:.9}
  .wrap{max-width:70rem;margin:0 auto;padding:1rem}
  #q{width:100%;max-width:28rem;padding:.8rem 1.1rem;border:0;border-radius:99px;font:inherit}
  .chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.35rem .9rem;border-radius:99px;font:inherit;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1rem;list-style:none;padding:0}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem .8rem;text-align:center;transition:transform .15s,box-shadow .15s}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 10px 24px #0002;outline:2px solid var(--blue)}
  .av{width:4.5rem;height:4.5rem;border-radius:50%;margin:0 auto .7rem;display:grid;place-items:center;font-size:1.5rem;font-weight:700;color:#fff}
  .card b{display:block;line-height:1.25}
  .n{display:block;margin-top:.4rem;color:var(--mute)}
  .role{display:inline-block;margin-top:.5rem;font-size:.75rem;padding:.15rem .6rem;border-radius:99px;background:var(--gold);color:#4a3b00}
  .role.sen{background:var(--line);color:var(--mute)}
  a{color:var(--blue)}
  .back{display:inline-block;margin-bottom:1rem;color:var(--blue);text-decoration:none;font-weight:600}
  .hero{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
  .hero .av{margin:0;width:6rem;height:6rem;font-size:2rem} .hero h2{margin:0;font-size:1.8rem}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem;margin:1.5rem 0}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
  .tile strong{display:block;font-size:2rem;line-height:1} .tile span{color:var(--mute);font-size:.85rem}
  .tl{list-style:none;padding:0 0 0 1.2rem;border-left:3px solid var(--line)}
  .tl li{position:relative;margin:0 0 1rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}
  .tl li::before{content:"";position:absolute;left:-1.7rem;top:1.1rem;width:.9rem;height:.9rem;border-radius:50%;background:var(--red)}
  .badge{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--red)} .tl small{color:var(--mute)}
  .tl a{color:var(--blue)} .tile strong{font-size:clamp(1.3rem,5vw,2rem);white-space:nowrap}
  .soon{border:2px dashed var(--line);border-radius:var(--r);padding:1rem;color:var(--mute);text-align:center}
  .chart{display:flex;align-items:flex-end;gap:3px;height:6rem;margin:.5rem 0 .2rem}
  .chart i{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
  .axis{display:flex;justify-content:space-between;color:var(--mute);font-size:.75rem}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin:1rem 0}
  .panel h3{margin:0 0 .5rem;font-size:1rem}
  .stack{display:flex;height:1.1rem;border-radius:99px;overflow:hidden;margin:.6rem 0}
  .legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.85rem;color:var(--mute)}
  .legend b{color:var(--ink)} .dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.3rem}
  .bill{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem 1rem;margin:.5rem 0}
  .bill:hover{border-color:var(--blue)} .bill small{color:var(--mute)} .pill{font-size:.7rem;padding:.1rem .5rem;border-radius:99px;background:var(--line);color:var(--mute);white-space:nowrap}
  footer{color:var(--mute);font-size:.8rem;text-align:center;padding:2rem 1rem}
</style>
<header>
  <h1>Sino Sila?</h1>
  <p>Who are your officials, and what's on their public record? Every item links to its source.</p>
  <input id="q" type="search" placeholder="Search a name…" aria-label="Search officials">
</header>
<main class="wrap" id="app"></main>
<footer>Public records only, each linked to its source. Not an accusation of wrongdoing. Unofficial, not affiliated with any government body.</footer>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = n => n.replace(/"[^"]*"/g, '').replace(/\s+/g, ' ').trim();           // drop nicknames for initials
const initials = n => { const p = clean(n).split(' ').filter(w => /^[A-Za-z]/.test(w) && !/^(Jr\.?|Sr\.?|II|III|IV)$/.test(w)); return (p[0][0] + (p[p.length-1][0] || '')).toUpperCase(); };
const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const av = n => `<div class="av" style="background:hsl(${hue(n)} 55% 40%)" aria-hidden="true">${initials(n)}</div>`;
const ICON = {membership:'🏛️', bill:'📜', vote:'🗳️', saln:'💼', campaign_finance:'💸', audit:'🔎', case:'⚖️', appointment:'📌'};
const app = document.getElementById('app'), q = document.getElementById('q');
let data = [], bills = {}, leadersOnly = false;

function list() {
  const t = q.value.toLowerCase();
  const rows = data.filter(o => o.name.toLowerCase().includes(t) && (!leadersOnly || o.position !== 'Senator'));
  app.innerHTML = `<div class="chips">
      <button class="chip" aria-pressed="${!leadersOnly}" data-f="all">All ${data.length}</button>
      <button class="chip" aria-pressed="${leadersOnly}" data-f="lead">Leadership</button></div>
    <ul class="grid">${rows.map(o => `<li><a class="card" href="#${esc(o.id)}">${av(o.name)}
      <b>${esc(clean(o.name))}</b><span class="role ${o.position === 'Senator' ? 'sen' : ''}">${esc(o.position)}</span><small class="n">${bills[o.id] ? bills[o.id].total + ' bills' : ''}</small></a></li>`).join('')}</ul>`;
}


const BUCKETS = [
  ['Signed into law', '#16a34a', s => s === 'APPROVED BY THE PRESIDENT OF THE PHILIPPINES'],
  ['Moving along', '#2563eb', s => /SECOND READING|CONFERE|PASSED BY BOTH|ENROLLED|PENDING IN THE HOUSE/.test(s)],
  ['In committee', '#9ca3af', s => s === 'PENDING IN THE COMMITTEE'],
  ['Merged into another bill', '#d97706', s => s.startsWith('CONSOLIDATED')],
  ['Withdrawn', '#dc2626', s => s === 'WITHDRAWN']];
const bucketOf = st => (BUCKETS.find(b => b[2](st)) || ['Other', '#6b7280'])[0];
const MONTHS = (() => { const m = []; for (let y = 2025, mo = 7; y < 2026 || mo <= 9; mo++) { if (mo > 12) { mo = 1; y++; } m.push(`${y}-${String(mo).padStart(2, '0')}`); } return m; })();
const monthName = k => new Date(k + '-01T00:00:00').toLocaleString('en', {month: 'short', year: '2-digit'});
const ACRONYMS = new Set('PNP BJMP BFP GSIS SK VAT SUC PWD HIV AIDS ID PRC MSME ZIP CHR CHED RTC EDCOM II III IV R.A. SBN'.split(' '));
const SMALL = new Set('OF THE AND FOR IN ON TO A AN OR'.split(' '));
const title = t => t.split(/\s+/).map((w, i) => {
  const core = w.replace(/^\(+|[),.]+$/g, '');
  if (/^\(.+\)$/.test(w) && core.length <= 7 || ACRONYMS.has(w.replace(/[),]+$/, '')) || /^\d/.test(w)) return w;   // (E-VAWC), PNP, 30-DAY
  return i && SMALL.has(w) ? w.toLowerCase() : w.toLowerCase().replace(/(^|[(\-/])([a-z])/g, (m, a, b) => a + b.toUpperCase());
}).join(' ');

function billsHtml(id) {
  const b = bills[id]; if (!b) return '';
  const counts = {}; for (const [st, n] of Object.entries(b.byStatus)) counts[bucketOf(st)] = (counts[bucketOf(st)] || 0) + n;
  const max = Math.max(...MONTHS.map(m => b.byMonth[m] || 0), 1);
  return `<div class="panel"><h3>Bills filed per month</h3>
      <div class="chart" role="img" aria-label="Bills filed per month, ${MONTHS.length} months">${MONTHS.map(m => `<i title="${monthName(m)}: ${b.byMonth[m] || 0}" style="height:${(b.byMonth[m] || 0) / max * 100}%"></i>`).join('')}</div>
      <div class="axis"><span>${monthName(MONTHS[0])}</span><span>${monthName(MONTHS[MONTHS.length - 1])}</span></div></div>
    <div class="panel"><h3>Where the bills stand</h3>
      <div class="stack" role="img" aria-label="Bill status breakdown">${BUCKETS.map(x => counts[x[0]] ? `<span title="${x[0]}: ${counts[x[0]]}" style="flex:${counts[x[0]]};background:${x[1]}"></span>` : '').join('')}</div>
      <div class="legend">${BUCKETS.filter(x => counts[x[0]]).map(x => `<span><span class="dot" style="background:${x[1]}"></span><b>${counts[x[0]]}</b> ${x[0]}</span>`).join('')}</div></div>
    <h3>Latest bills</h3>${b.latest.map(([no, t, d, st, bid]) => `<a class="bill" href="https://senate.gov.ph/legislative-documents/bills/${esc(bid)}" target="_blank" rel="noopener">
      <b>${esc(title(t))}</b><br><small>${esc(no)} · filed ${esc(d)}</small> <span class="pill">${esc(bucketOf(st))}</span></a>`).join('')}
    <p><small>Bills where this senator is listed as author, 20th Congress. Source: <a href="${esc(bills._meta.source)}" target="_blank" rel="noopener">Senate Legislative Information System</a>, retrieved ${esc(bills._meta.retrieved)}.</small></p>`;
}

function profile(o) {
  const last = o.records.map(r => r.retrieved).sort().pop();
  app.innerHTML = `<a class="back" href="#">← Everyone</a>
    <div class="hero">${av(o.name)}<div><h2>${esc(o.name)}</h2><span class="role">${esc(o.position)}</span> <small>${esc(o.chamber)} · ${esc(o.term)}</small></div></div>
    <div class="tiles">
      <div class="tile"><strong>${bills[o.id]?.total ?? '–'}</strong><span>bills authored</span></div>
      <div class="tile"><strong>${bills[o.id] ? bills[o.id].byStatus['APPROVED BY THE PRESIDENT OF THE PHILIPPINES'] || 0 : '–'}</strong><span>signed into law</span></div>
      <div class="tile"><strong>${esc(last)}</strong><span>last checked</span></div></div>
    ${billsHtml(o.id)}
    <h3>Record</h3><ul class="tl">${o.records.map(r => `<li><span class="badge">${ICON[r.type] || '•'} ${esc(r.type)}</span>
      <div>${esc(r.title)}</div><small>${esc(r.date)} · <a href="${esc(r.source_url)}" rel="noopener" target="_blank">view source ↗</a></small></li>`).join('')}</ul>
    <div class="soon">🗳️ Votes, SALN and more are coming soon.</div>`;
}

function route() { const o = data.find(o => o.id === location.hash.slice(1)); o ? profile(o) : list(); scrollTo(0, 0); }
app.onclick = e => { const f = e.target.dataset.f; if (f) { leadersOnly = f === 'lead'; list(); } };
q.oninput = () => { if (location.hash) location.hash = ''; else list(); };
onhashchange = route;
Promise.all([fetch('data/officials.json'), fetch('data/bills.json')].map(p => p.then(r => r.json()))).then(([d, b]) => { data = d; bills = b; route(); });
</script>
